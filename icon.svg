<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Diamond Gradient -->
    <linearGradient id="gem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" /> <!-- Cyan -->
      <stop offset="50%" stop-color="#6366F1" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#EC4899" /> <!-- Pink -->
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base (iOS style rounded corner) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Glow Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#gem-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Diamond Geometry -->
  <g filter="url(#glow)">
    <!-- Top facets -->
    <polygon points="256,120 180,180 256,200" fill="#38BDF8" opacity="0.8" />
    <polygon points="256,120 256,200 332,180" fill="#60A5FA" opacity="0.9" />
    <!-- Center facets -->
    <polygon points="180,180 256,380 256,200" fill="#4F46E5" opacity="0.9" />
    <polygon points="256,200 256,380 332,180" fill="#7C3AED" opacity="0.85" />
    <!-- Side facets -->
    <polygon points="180,180 140,180 256,380" fill="#0369A1" opacity="0.7" />
    <polygon points="332,180 256,380 372,180" fill="#6D28D9" opacity="0.7" />
    <!-- Top side facets -->
    <polygon points="256,120 180,180 140,180" fill="#0EA5E9" opacity="0.85" />
    <polygon points="256,120 332,180 372,180" fill="#8B5CF6" opacity="0.85" />
  </g>
</svg>
